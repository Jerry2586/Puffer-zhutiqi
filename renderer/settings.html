<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none';"><title>河豚主题中心 · 服务设置</title><link rel="stylesheet" href="settings.css"></head><body><main><header><span class="mark">◈</span><div><small>HETUN THEME STUDIO</small><h1>河豚主题中心</h1></div><span id="version"></span></header><section class="intro"><span class="badge">独立主题制作软件</span><h2>连接你的主题授权</h2><p>配置授权服务、绑定域名与可信公钥，验证后进入主题工作台。</p></section><form id="form"><div class="two"><label>授权服务地址<input name="url" placeholder="https://license.example.com" required></label><label>绑定域名<input name="domain" placeholder="你的影视站点域名" required></label></div><label>授权 Key<input name="key" type="password" placeholder="云端后台签发的主题授权 Key" autocomplete="off"></label><label><span class="label-row">可信授权公钥<button id="pick" type="button">选择 PEM 文件</button></span><textarea name="publicKey" rows="5" placeholder="-----BEGIN PUBLIC KEY-----" required></textarea></label><p class="hint">公钥由授权服务管理员提供。软件只接受校验通过的主题授权，密钥由本机系统加密保存。</p><p id="message" role="status"></p><div class="actions"><button id="back" type="button" class="secondary">返回主题工作台</button><button id="submit" type="submit">验证并保存</button></div></form><footer>主题与素材、运行记录在独立数据目录保存。<span id="data"></span></footer></main><script src="settings.js"></script></body></html>
