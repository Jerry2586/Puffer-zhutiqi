name: Build and verify theme center
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare external paths and check tag version
        id: metadata
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP "hetun-tools"
          "HETUN_TOOLS_ROOT=$toolsRoot" >> $env:GITHUB_ENV
          "HETUN_THEME_BUILD_ROOT=$(Join-Path $toolsRoot 'projects/hetun-theme-center')" >> $env:GITHUB_ENV
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Install dependencies outside source
        run: node scripts/setup.cjs
      - name: Check out published packager 0.7.5 for compatibility checks
        uses: actions/checkout@v4
        with:
          repository: Jerry2586/Puffer-dabaoqi
          ref: 797e0f7779984e32698028d1eae10b13e8d5758c
          path: .compat/packager
          persist-credentials: false
      - name: Test offline editor and published packager boundaries
        run: node --test tests/*.test.cjs
      - name: Type check, compile and build Windows programs
        run: node scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: theme-center-windows
          path: |
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/*.exe
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/*.blockmap
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/SHA256SUMS.txt
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/release-info.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: theme-center-windows
          path: release
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          node -e 'const m=require("./release-info.json"); if ("v"+m.version!==process.env.GITHUB_REF_NAME || m.revision!==process.env.GITHUB_SHA || m.artifacts.filter(a=>a.name.endsWith(".exe")).length!==2) throw Error("Release version/revision/artifacts mismatch");'
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.exe ./*.blockmap SHA256SUMS.txt release-info.json --verify-tag --latest --title "河豚主题中心 $GITHUB_REF_NAME" --notes-file "$GITHUB_WORKSPACE/RELEASE-NOTES.md"
