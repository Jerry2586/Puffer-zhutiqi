name: Build and verify theme center
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare external paths and check tag version
        id: metadata
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP "hetun-tools"
          "HETUN_TOOLS_ROOT=$toolsRoot" >> $env:GITHUB_ENV
          "HETUN_THEME_BUILD_ROOT=$(Join-Path $toolsRoot 'projects/hetun-theme-center')" >> $env:GITHUB_ENV
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Install dependencies outside source
        run: node scripts/setup.cjs
      - name: Checkout matching terminal integration fixture
        uses: actions/checkout@v4
        with:
          repository: Jerry2586/Puffer-zhongduan
          ref: 04c3c719f2db48ee0fd7ee62642386816667ce08
          path: .terminal-integration
      - name: Test actual service and authorization boundaries
        env:
          HETUN_TERMINAL_SOURCE: ${{ github.workspace }}/.terminal-integration
        run: node --test tests/*.test.cjs
      - name: Type check, compile and build Windows programs
        run: node scripts/build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: theme-center-windows
          path: |
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/*.exe
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/*.blockmap
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/SHA256SUMS.txt
            ${{ env.HETUN_THEME_BUILD_ROOT }}/release/v${{ steps.metadata.outputs.version }}/release-info.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-center-windows
          path: release
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.exe ./*.blockmap SHA256SUMS.txt release-info.json --verify-tag --latest --title "河豚主题中心 $GITHUB_REF_NAME" --notes "Windows x64主题制作软件。新增多端接入配置、河豚客户端协议 v1 和内嵌 OpenAPI 3.1；支持为安卓手机、平板、Android TV、iPhone 和 iPad 声明对应主题目标，保留旧 v2 主题包兼容。原生客户端与打包器仍需实现协议适配，本版未完成真机联调。附安装包、便携版、SHA256与构建信息。当前未配置Windows代码签名，覆盖安装仍需实机验收。"
